<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Player</title>
</head>

<body>
  <div id="app">
    <h1 id="title">Web Audio Player</h1>
    <audio src="src/youth® - tell me why [NCS Release].mp3" id="audio" type="audio/mpeg"></audio>
    <div class="control-card">
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" orient="vertical">
      <div class="control-wrapper">
        <button id="play-btn" class="paused"></button>
        <span id="time"></span>
        <input type="range" id="seeker" min="0" max="1" step="0.01">
        <span id="duration"></span>
      </div>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
